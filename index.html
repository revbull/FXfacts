<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>トレード診断</title>

<style>

body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
background:#f5f6f7;
}

.container{
max-width:680px;
margin:auto;
background:white;
padding:20px;
}

h1{
font-size:24px;
}

.progress{
height:8px;
background:#eee;
border-radius:10px;
overflow:hidden;
margin-bottom:20px;
}

.bar{
height:100%;
width:0%;
background:#00c853;
transition:0.3s;
}

.question{
font-size:20px;
margin-bottom:20px;
}

.option{
display:block;
background:#f1f1f1;
padding:14px;
margin:10px 0;
border-radius:8px;
cursor:pointer;
text-align:center;
}

.option:hover{
background:#e0e0e0;
}

.cta{
display:block;
background:#00c853;
color:white;
text-align:center;
padding:18px;
font-size:22px;
font-weight:bold;
border-radius:12px;
text-decoration:none;
margin-top:20px;
}

.result{
display:none;
text-align:center;
}

.loading{
font-size:20px;
text-align:center;
}

.sticky{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
border-top:1px solid #ddd;
padding:10px;
text-align:center;
display:none;
}

.sticky a{
background:#00c853;
color:white;
padding:14px 20px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

<h1>
30秒で分かる  
トレード診断
</h1>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div id="quiz">

<div class="question" id="question">
投資経験はありますか？
</div>

<div class="option" onclick="next()">初心者</div>
<div class="option" onclick="next()">少しある</div>
<div class="option" onclick="next()">経験者</div>

</div>

<div class="loading" id="loading" style="display:none;">
AI分析中...
</div>

<div class="result" id="result">

<h2>
あなたに最適なトレード方法
</h2>

<p>
診断結果によると、  
初心者でも始めやすい海外FXが最適です。
</p>

<a href="YOUR_AFF_LINK" class="cta">
↓↓公式サイトはこちら↓↓
</a>

</div>

</div>

<div class="sticky" id="sticky">
<a href="YOUR_AFF_LINK">公式サイトへ</a>
</div>

<script>

let step=0;

function next(){

step++;

document.getElementById("bar").style.width=(step*33)+"%";

if(step==1){

document.getElementById("question").innerHTML="1日にどれくらいスマホを使いますか？";

}

else if(step==2){

document.getElementById("question").innerHTML="副収入に興味がありますか？";

}

else{

document.getElementById("quiz").style.display="none";
document.getElementById("loading").style.display="block";

setTimeout(function(){

document.getElementById("loading").style.display="none";
document.getElementById("result").style.display="block";
document.getElementById("sticky").style.display="block";

},2000);

}

}

</script>

</body>

</html>
