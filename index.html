    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        
        // Всички параметри от PopAds
        const p = {
            imp: urlParams.get('imp_id'), src: urlParams.get('src_id'), camp: urlParams.get('camp_id'),
            q: urlParams.get('q'), os: urlParams.get('os'), br: urlParams.get('br'),
            dev: urlParams.get('dev'), form: urlParams.get('form'), res: urlParams.get('res'),
            cty: urlParams.get('cty'), adb: urlParams.get('adb'), bid: urlParams.get('bid')
        };

        // 1. Google Analytics Deep Dive
        if (typeof gtag === 'function') {
            gtag('event', 'PopAds_Traffic_In', {
                'website_id': p.src, 'traffic_quality': p.q, 'os': p.os, 'browser': p.br,
                'device': p.dev, 'country': p.cty, 'adblock': p.adb, 'bid': p.bid
            });
        }

        // 2. Почистване на URL (за по-добър вид)
        if (window.history.replaceState && urlParams.toString() !== "") {
            window.history.replaceState({}, document.title, window.location.pathname);
        }

        // 3. XM Link Injection & PopAds Postback
        const links = document.querySelectorAll('.xm-tracker-link');
        links.forEach(link => {
            let url = new URL(link.href);
            if (p.imp) url.searchParams.set('subid1', p.imp);
            if (p.src) url.searchParams.set('subid2', p.src);
            if (p.q)   url.searchParams.set('subid3', `q${p.q}_c${p.camp}`);
            link.href = url.toString();

            link.addEventListener('click', function() {
                if (p.imp) {
                    const pb = `https://www.popads.net/users/postback/2s/0/aid/aa767929957b4ca372123fe3656e20ec/id/${p.imp}/value/0.10`;
                    navigator.sendBeacon ? navigator.sendBeacon(pb) : new Image().src = pb;
                }
                if (typeof gtag === 'function') gtag('event', 'conversion', {'event_label': p.src});
            });
        });
    });
    </script>
