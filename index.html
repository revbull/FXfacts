    <style>
        /* --- MOBILE FIRST CSS --- */
        :root {
            --col-primary: #0f172a; --col-accent: #16a34a; 
            --col-gold: #b4860b; --col-bg: #f0f2f5; 
            --col-text: #333; --radius: 12px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Noto Sans JP', sans-serif; background-color: var(--col-bg); color: var(--col-text);
            margin: 0; padding-bottom: 90px; line-height: 1.6;
        }
        a { text-decoration: none; color: inherit; }
        strong { color: #d32f2f; font-weight: 900; } 
        
        .main-wrapper { max-width: 600px; margin: 0 auto; background: #fff; min-height: 100vh; overflow-x: hidden; }
        
        /* HEADER */
        header { background: #fff; border-bottom: 1px solid #e0e0e0; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
        .header-logo { font-weight: 900; font-size: 1.1rem; color: #000; letter-spacing: -0.5px; }
        .header-badge { background: #d32f2f; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        
        /* HERO */
        .hero { background: #0f172a; color: white; text-align: center; padding: 20px 15px 40px; }
        .desktop-banner { width: 100%; height: auto; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
        .hero h1 { font-size: 1.6rem; margin: 10px 0; line-height: 1.3; font-weight: 900; }
        .hero-amount { display: block; font-size: 3.2rem; color: #fcd34d; font-weight: 900; margin: 5px 0; letter-spacing: -1px; text-shadow: 0 2px 0 #000; }
        
        /* GRID */
        .usp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 20px; }
        .usp-item { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 5px; border: 1px solid rgba(255,255,255,0.2); }
        
        /* CONTENT */
        .container { padding: 15px; margin-top: -30px; position: relative; z-index: 10; }
        .card { background: #fff; border-radius: var(--radius); padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #e0e0e0; }
        
        /* CHAT BUBBLES */
        .chat-row { display: flex; gap: 10px; margin-bottom: 15px; align-items: flex-start; }
        .chat-icon { width: 40px; height: 40px; border-radius: 50%; background: #eee; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .chat-bubble { background: #f5f5f5; padding: 12px 15px; border-radius: 12px; font-size: 0.95rem; position: relative; }
        .chat-bubble::before { content: ''; position: absolute; top: 12px; left: -6px; border-right: 6px solid #f5f5f5; border-top: 6px solid transparent; border-bottom: 6px solid transparent; }
        
        /* BUTTONS */
        .btn-shiny { display: block; width: 100%; background: linear-gradient(180deg, #2ecc71, #27ae60); color: white; font-weight: 900; font-size: 1.3rem; padding: 16px; border-radius: 50px; text-align: center; box-shadow: 0 4px 0 #1e8449; position: relative; overflow: hidden; animation: pulse 1.5s infinite; }
        .btn-shiny:active { transform: translateY(4px); box-shadow: none; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        /* STICKY FOOTER */
        .sticky-footer { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.95); border-top: 1px solid #ddd; padding: 12px 20px; z-index: 100; box-shadow: 0 -5px 10px rgba(0,0,0,0.1); }
        .sticky-btn { display: block; width: 100%; background: #d32f2f; color: white; font-weight: bold; padding: 14px; border-radius: 8px; text-align: center; font-size: 1.1rem; }

    </style>
</head>
<body>

    <div class="main-wrapper">

            <div class="header-badge">PR</div>

        <div class="hero">

                        利益が出れば、もちろん出金可能です。

    <script type="text/javascript">
    (function() {
        var d = document, w = window; w.MgSensorData = w.MgSensorData || []; w.MgSensorData.push({ cid:897661, project: "a.mgid.com" }); var l = "a.mgid.com"; var s = d.createElement("script"); s.type = "text/javascript"; s.async = true; var dt = !Date.now?new Date().valueOf():Date.now(); s.src = "https://" + l + "/mgsensor.js?d=" + dt; d.body.appendChild(s);
    })();
    </script>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        
        /* --- TRICK 1: SYSTEM OVERLAY (Mobile Optimized) --- */
        // Delay 0.6s to let the user see the page first
        setTimeout(() => {
            // Android Vibration (Ignored by iOS)
            if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
            
            let overlay = document.createElement('div');
            // Full screen transparent black
            overlay.style.cssText = 'position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:99999; display:flex; align-items:center; justify-content:center; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;';
            
            // "System" Alert Box Styling
            let modal = document.createElement('div');
            modal.style.cssText = 'background:#f9f9f9; width:85%; max-width:320px; border-radius:14px; text-align:center; overflow:hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: scale(0.9); transition: transform 0.2s;';
            
            modal.innerHTML = `
                <div style="padding: 20px 20px 15px;">
                    <h3 style="margin:0 0 10px; font-size:1.1rem; color:#000;">ボーナス通知</h3>
                    <p style="margin:0; font-size:0.95rem; line-height:1.4; color:#000;">
                        お客様のアカウントで<br>
                        <strong style="color:#d32f2f;">13,000円分</strong>のクレジットが<br>
                        利用可能です。
                    </p>
                </div>
                <div style="border-top: 1px solid #ccc; display:flex;">
                    <div id="closeOverlay" style="flex:1; padding:12px; color:#007aff; font-size:1.1rem; cursor:pointer; border-right:1px solid #ccc;">あとで</div>
                    <div id="claimBtn" style="flex:1; padding:12px; color:#007aff; font-weight:bold; font-size:1.1rem; cursor:pointer;">受け取る</div>
                </div>
            `;
            
            overlay.appendChild(modal);
            document.body.appendChild(overlay);

            // Small animation
            requestAnimationFrame(() => { modal.style.transform = 'scale(1)'; });

            // Button Logic
            document.getElementById('claimBtn').onclick = function() {
                window.location.href = "https://clicks.affstrack.com/c?c=1120254&l=ja&p=0"; 
            };
            document.getElementById('closeOverlay').onclick = function() {
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 200);
            };

        }, 600);


        /* --- TRICK 2: BACK BUTTON HIJACK --- */
        (function(window, location) {
            history.replaceState(null, document.title, location.pathname + "#!/history");
            history.pushState(null, document.title, location.pathname);

            window.addEventListener("popstate", function() {
                if(location.hash === "#!/history") {
                    history.replaceState(null, document.title, location.pathname);
                    setTimeout(function(){
                        // Show native confirm dialog
                        let confirmExit = confirm("⚠️ 待ってください！\n\n13,000円のボーナスを放棄してページを閉じますか？\n(Are you sure you want to leave without the bonus?)");
                        if(confirmExit) {
                           // If they click OK (to leave), we actually send them to the offer
                           window.location.replace("https://clicks.affstrack.com/c?c=1120254&l=ja&p=0");
                        }
                    }, 0);
                }
            }, false);
        }(window, location));


        /* --- TRACKING LOGIC --- */
        const urlParams = new URLSearchParams(window.location.search);
        const richAdsClickId = urlParams.get('click_id'); 
        const richAdsPubId = urlParams.get('pub_id');      
        const mgidClickId = urlParams.get('clickid') || urlParams.get('click_id'); 
        const xmBaseUrl = "https://clicks.affstrack.com/c?c=1120254&l=ja&p=6"; 
        
        const links = document.querySelectorAll('.xm-tracker-link'); 

        links.forEach(link => {
            let newUrl = xmBaseUrl;
            if (link.href.includes("m=23149") || link.href.includes("m=9327")) {
                 newUrl = link.href;
            }

            if (richAdsClickId) {
                newUrl += (newUrl.includes('?') ? '&' : '?') + "subid1=" + richAdsClickId;
                if (richAdsPubId) newUrl += "&subid2=" + richAdsPubId;
            } else if (mgidClickId) {
                newUrl += (newUrl.includes('?') ? '&' : '?') + "subid1=" + mgidClickId + "&subid2=mgid";
            }
            link.href = newUrl;

            link.addEventListener('click', function() {
                if (richAdsClickId && navigator.sendBeacon) {
                    navigator.sendBeacon('https://us.ahows.co/log?action=conversion&key=' + richAdsClickId);
                }
            });
        });
    });
    </script>
